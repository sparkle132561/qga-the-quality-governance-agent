name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Ruff
        run: python -m ruff check backend scripts tests
      - name: Pytest (SQLite profile)
        run: |
          mkdir -p data/runtime
          python -m pytest -q -p no:cacheprovider --basetemp=data/runtime/tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend type check and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
